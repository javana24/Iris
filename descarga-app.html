<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descarga la app IRIS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #f5f0ff 0%, #e8e0f5 50%, #f0e8ff 100%);
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(147, 51, 234, 0.12);
      text-align: center;
      max-width: 420px;
    }
    h1 {
      color: #581c87;
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
    }
    .sub {
      color: #6b21a8;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .qr-wrap {
      width: 260px;
      height: 260px;
      margin: 0 auto 1.5rem;
      background: #fff;
      border: 2px solid #e9d5ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-wrap img {
      max-width: 220px;
      max-height: 220px;
    }
    .placeholder {
      color: #a78bfa;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #c4b5fd;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #9333ea;
      box-shadow: 0 0 0 2px rgba(147, 51, 234, 0.2);
    }
    .hint {
      font-size: 0.8rem;
      color: #7c3aed;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Descarga la app IRIS</h1>
    <p class="sub">Escanea el código con tu móvil para instalar la app</p>

    <div class="qr-wrap">
      <div id="qrBox">
        <img id="qrImg" src="" alt="QR de descarga" />
        <p id="qrPlaceholder" class="placeholder">Introduce o pega la URL del APK abajo y se generará el QR.</p>
      </div>
    </div>

    <label for="urlInput" style="display:block; text-align:left; font-size:0.85rem; color:#6b21a8; margin-bottom:0.25rem;">URL de descarga del APK</label>
    <input type="url" id="urlInput" placeholder="https://... o http://IP:3001/app.apk" />

    <p class="hint">También puedes usar la barra de direcciones: descarga-app.html?url=TU_URL</p>
  </div>

  <script>
    var API = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=10&data=';
    var img = document.getElementById('qrImg');
    var placeholder = document.getElementById('qrPlaceholder');
    var input = document.getElementById('urlInput');

    function updateQr(url) {
      url = (url || '').trim();
      if (!url) {
        img.style.display = 'none';
        img.removeAttribute('src');
        placeholder.style.display = 'block';
        return;
      }
      placeholder.style.display = 'none';
      img.style.display = 'block';
      img.src = API + encodeURIComponent(url);
    }

    var params = new URLSearchParams(location.search);
    var initial = params.get('url') || '';
    if (initial) {
      input.value = initial;
      updateQr(initial);
    } else {
      updateQr('');
    }

    input.addEventListener('input', function () { updateQr(input.value); });
    input.addEventListener('paste', function () { setTimeout(function () { updateQr(input.value); }, 0); });
  </script>
</body>
</html>
