<div class="fixed bottom-5 right-5 z-[9999]">
    <button (click)="quickExit()"
        class="group inline-flex min-h-[48px] items-center justify-center gap-2 rounded-full border border-[#F1A6A6]/40 bg-[#6B1515]/90 px-4 py-3 text-white shadow-[0_18px_44px_rgba(107,21,21,0.35)] backdrop-blur transition-transform duration-200 hover:-translate-y-1 hover:bg-[#B71C1C] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-200"
        title="Salir rápido de la aplicación"
        aria-label="Salir rápido de la aplicación">

        <div class="animate-pulse">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </div>
        <span class="hidden text-xs font-black uppercase tracking-wider sm:inline">Salir rápido</span>
    </button>
</div>
