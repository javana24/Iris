<div
  class="fixed left-0 right-0 top-0 z-[100] w-full border-b border-white/[0.06] bg-[#0D0D0F]/90 shadow-[0_1px_0_rgba(255,255,255,0.04)] backdrop-blur-xl"
>
  <header class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <button
      type="button"
      class="group flex items-center gap-3 rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-purple-400/70"
      (click)="navigateTo('inicio')"
      aria-label="Ir al inicio"
    >
      <span class="flex h-8 w-8 items-center justify-center rounded-full bg-[#7B2FBE]/20 ring-1 ring-[#AA6FE0]/40 transition-transform duration-200 group-hover:scale-105">
        <svg class="h-4 w-4 text-[#D9B8FF]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3l7 4v5c0 4.5-2.8 7.8-7 9-4.2-1.2-7-4.5-7-9V7l7-4z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-5" />
        </svg>
      </span>
      <span class="text-lg font-black tracking-tight text-[#C996FF]">IRIS</span>
    </button>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Navegación principal">
      <button (click)="navigateTo('inicio')" [class.active]="isActive('inicio')" class="nav-link">
        Inicio
      </button>
      <button (click)="navigateTo('problema')" [class.active]="isActive('problema')" class="nav-link">
        Problema
      </button>
      <button (click)="navigateTo('simuladores')" [class.active]="isActive('simuladores')" class="nav-link">
        Simulador
      </button>
      <button (click)="navigateTo('simulacion')" [class.active]="isActive('simulacion')" class="nav-link">
        Dojo
      </button>
      <button (click)="navigateTo('impacto')" [class.active]="isActive('impacto')" class="nav-link">
        Impacto
      </button>
    </nav>

    <div class="hidden items-center gap-3 md:flex">
      <button
        type="button"
        (click)="navigateTo('simuladores')"
        class="rounded-full bg-[#7B2FBE] px-5 py-2 text-xs font-black text-white shadow-[0_10px_30px_rgba(123,47,190,0.35)] transition-transform duration-200 hover:-translate-y-0.5 hover:bg-[#9B59D6] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#AA6FE0]"
      >
        Probar simulador
      </button>
      <button
        type="button"
        (click)="navigateTo('alineacion')"
        class="inline-flex items-center gap-2 rounded-full bg-[#F1A6A6] px-4 py-2 text-xs font-black text-[#2A0C0C] transition-transform duration-200 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-200"
      >
        <span class="h-2 w-2 rounded-full bg-[#6B1515]"></span>
        Ayuda rápida
      </button>
      <button
        type="button"
        (click)="toggleTheme()"
        class="group inline-flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-white/[0.03] text-[#C9C9D4] transition-all duration-200 hover:-translate-y-0.5 hover:border-[#AA6FE0]/50 hover:bg-white/[0.08] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#AA6FE0]"
        [attr.aria-label]="isDarkMode ? 'Activar modo claro' : 'Activar modo oscuro'"
      >
        <svg *ngIf="isDarkMode" class="h-5 w-5 transition-transform duration-200 group-hover:rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.36-6.36l-1.42 1.42M7.06 16.94l-1.42 1.42m12.72 0l-1.42-1.42M7.06 7.06 5.64 5.64M12 8a4 4 0 100 8 4 4 0 000-8z" />
        </svg>
        <svg *ngIf="!isDarkMode" class="h-5 w-5 transition-transform duration-200 group-hover:-rotate-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12.79A8.5 8.5 0 1111.21 3 6.5 6.5 0 0021 12.79z" />
        </svg>
      </button>
      <button
        type="button"
        (click)="goToProfile()"
        [ngClass]="isProfileRoute() ? 'border-[#AA6FE0]/70 bg-[#7B2FBE]/25 text-white shadow-[0_10px_30px_rgba(123,47,190,0.25)]' : 'border-white/10 bg-white/[0.03] text-[#C9C9D4]'"
        class="group inline-flex h-10 w-10 items-center justify-center rounded-full border transition-all duration-200 hover:-translate-y-0.5 hover:border-[#AA6FE0]/50 hover:bg-white/[0.08] hover:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#AA6FE0]"
        aria-label="Abrir perfil"
      >
        <svg class="h-5 w-5 transition-transform duration-200 group-hover:scale-105" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4.5 20.25a7.5 7.5 0 0115 0" />
        </svg>
      </button>
    </div>

    <div class="flex items-center gap-2 md:hidden">
      <button
        type="button"
        (click)="goToProfile()"
        [ngClass]="isProfileRoute() ? 'border-[#AA6FE0]/70 bg-[#7B2FBE]/25 text-white' : 'border-white/10 text-[#EAEAEA]'"
        class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-full border transition-colors duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-purple-400/70"
        aria-label="Abrir perfil"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4.5 20.25a7.5 7.5 0 0115 0" />
        </svg>
      </button>
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-full border border-white/10 text-[#EAEAEA] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-purple-400/70"
        [attr.aria-label]="isMobileMenuOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-controls="mobile-nav-menu"
      >
        <svg class="h-5 w-5" stroke="currentColor" fill="none" viewBox="0 0 24 24">
          <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"></path>
          <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </header>

  <div
    *ngIf="isMobileMenuOpen"
    id="mobile-nav-menu"
    class="border-t border-white/[0.06] bg-[#121217]/95 px-4 py-4 shadow-2xl backdrop-blur-xl md:hidden"
  >
    <div class="grid gap-2">
      <button (click)="navigateTo('inicio')" [class.active]="isActive('inicio')" class="nav-link text-left">Inicio</button>
      <button (click)="navigateTo('problema')" [class.active]="isActive('problema')" class="nav-link text-left">Problema</button>
      <button (click)="goToProfile()" [ngClass]="isProfileRoute() ? 'active' : ''" class="nav-link text-left">Mi perfil</button>
      <button (click)="navigateTo('simuladores')" [class.active]="isActive('simuladores')" class="nav-link text-left">Simulador</button>
      <button (click)="navigateTo('simulacion')" [class.active]="isActive('simulacion')" class="nav-link text-left">Dojo</button>
      <button (click)="navigateTo('impacto')" [class.active]="isActive('impacto')" class="nav-link text-left">Impacto</button>
      <button (click)="toggleTheme()" class="nav-link text-left">
        {{ isDarkMode ? 'Activar modo claro' : 'Activar modo oscuro' }}
      </button>
      <button (click)="navigateTo('alineacion')" class="mt-2 rounded-xl bg-[#F1A6A6] px-4 py-3 text-left text-xs font-black text-[#2A0C0C]">
        Ayuda rápida
      </button>
    </div>
  </div>
</div>
